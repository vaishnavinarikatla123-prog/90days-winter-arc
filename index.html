
<!DOCTYPE html>
<html>
<head>
    <title>Password Show Hide</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 320px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .password-box {
            display: flex;
            border: 1px solid #ccc;
            border-radius: 6px;
            overflow: hidden;
        }

        .password-box input {
            flex: 1;
            padding: 12px;
            border: none;
            outline: none;
            font-size: 16px;
        }

        .password-box button {
            padding: 0 15px;
            border: none;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        .password-box button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Login</h2>

        <div class="password-box">
            <input type="password" id="password" placeholder="Enter password">
            <button onclick="togglePassword()" id="toggleBtn">
                Show
            </button>
        </div>

    </div>

    <script>
        function togglePassword() {
            let password = document.getElementById("password");
            let button = document.getElementById("toggleBtn");

            if (password.type === "password") {
                password.type = "text";
                button.innerText = "Hide";
            } else {
                password.type = "password";
                button.innerText = "Show";
            }
        }
    </script>

</body>
</html>
